<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>gf-ui</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="toasts" class="toasts toasts-top"></div>

    <div id="progress" class="progress progress-bottom">
      <div class="progress-top">
        <span id="progress-label" class="progress-label"></span>
        <span id="progress-percent" class="progress-percent">0%</span>
      </div>
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="progress-cancel" class="progress-cancel"><kbd id="progress-key">X</kbd> Cancelar</div>
    </div>

    <div id="textui" class="textui textui-left">
      <kbd id="textui-key"></kbd>
      <span id="textui-text"></span>
    </div>

    <script src="app.js"></script>
  </body>
</html>
